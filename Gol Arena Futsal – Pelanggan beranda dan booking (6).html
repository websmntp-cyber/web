  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

{{accent}}\">Sewa lapangan futsal · Booking online<\u002Fspan>\n<h1 style=\"margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(52px,8vw,96px);line-height:0.95;letter-spacing:0.01em;text-transform:uppercase\">Pilih jam,<br>kunci lapangan,<br>langsung main.<\u002Fh1>\n<p style=\"margin:0;font-size:19px;line-height:1.55;color:#C3D2C8;max-width:520px\">Cek jadwal kosong semua lapangan, pilih jam yang cocok, lalu kirim booking langsung dari ponsel.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:8px\">\n<a class=\"btn\" href=\"#booking\" style=\"display:inline-flex;align-items:center;min-height:52px;box-sizing:border-box;padding:0 28px;border-radius:999px;background:{{accent}};color:#0C2B20;font-weight:700;font-size:17px\">Cek jadwal dan booking<\u002Fa>\n<a class=\"btn\" href=\"#lapangan\" style=\"display:inline-flex;align-items:center;min-height:52px;box-sizing:border-box;padding:0 28px;border-radius:999px;border:1.5px solid #5E8C75;color:#F3F5EE;font-weight:600;font-size:17px\">Lihat lapangan<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 420px;min-width:0\">\n<svg sc-camel-view-box=\"0 0 560 300\" role=\"img\" aria-label=\"Ilustrasi lapangan futsal dilihat dari atas\" style=\"width:100%;height:auto;display:block\">\n<rect x=\"20\" y=\"20\" width=\"520\" height=\"260\" rx=\"6\" fill=\"#16573C\"><\u002Frect>\n<g fill=\"#1A6244\">\n<rect x=\"106.67\" y=\"20\" width=\"86.67\" height=\"260\"><\u002Frect>\n<rect x=\"280\" y=\"20\" width=\"86.67\" height=\"260\"><\u002Frect>\n<rect x=\"453.33\" y=\"20\" width=\"86.67\" height=\"260\"><\u002Frect>\n<\u002Fg>\n<g fill=\"none\" stroke=\"#E7F2DE\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<rect x=\"20\" y=\"20\" width=\"520\" height=\"260\" rx=\"6\"><\u002Frect>\n<line x1=\"280\" y1=\"20\" x2=\"280\" y2=\"280\"><\u002Fline>\n<circle cx=\"280\" cy=\"150\" r=\"39\"><\u002Fcircle>\n<path d=\"M20 52.5A78 78 0 0 1 98 130.5V169.5A78 78 0 0 t-transform:uppercase\">Pilih tanggal<\u002Fh3>\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"Pilih tanggal\" style=\"display:flex;gap:8px;overflow-x:auto;padding-bottom:6px\">\n<sc-for list=\"{{ days }}\" as=\"day\" hint-placeholder-count=\"7\">\n<button type=\"button\" sc-camel-on-click=\"{{ day.pick }}\" aria-pressed=\"{{ day.pressed }}\" style=\"flex:0 0 auto;min-width:76px;min-height:80px;box-sizing:border-box;padding:10px 8px;border-width:1.5px;border-style:solid;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;{{ day.css }}\">\n<span style=\"font-size:13px;font-weight:600\">{{ day.dow }}<\u002Fspan>\n<span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;line-height:1\">{{ day.num }}<\u002Fspan>\n<span style=\"font-size:13px;font-weight:500\">{{ day.mon }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px\">\n<span style=\"width:32px;height:32px;border-radius:50%;background:#0C2B20;color:{{accent}};display:inline-flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px\">2<\u002Fspan>\n<h3 style=\"margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.02em;text-transform:uppercase\">Pilih lapangan<\u002Fh3>\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"Pilih lapangan\" style=\"display:flex;flex-wrap:wrap;gap:12px\">\n<sc-for list=\"{{ courts }}\" as=\"court\" hint-placeholder-count=\"3\">\n<button type=\"button\" sc-camel-on-click=\"{{ court.pick }}\" aria-pressed=\"{{ court.pressed }}\" style=\"flex:1 1 160px;min-height:68px;box-sizing:border-box;padding:12px 16px;border-width:1.5px;border-style:solid;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;font-family:inherit;{{ court.css }}\">\n<span style=\"font-weight:700;font-size:17px\">{{ court.name }}<\u002Fspan>\n<span style=\"font-size:14px\">{{ court.type }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px\">\n<span style=\"width:32px;height:32px;border-radius:50%;background:#0C2B20;color:{{accent}};display:inline-flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px\">3<\u002Fspan>\n<h3 style=\"margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.02em;text-transform:uppercase\">Pilih jam main<\u002Fh3>\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"Pilih jam main\" style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px\">\n<sc-for list=\"{{ slots }}\" as=\"slot\" hint-placeholder-count=\"15\">\n<button type=\"button\" disabled=\"{{ slot.unavailable }}\" sc-camel-on-click=\"{{ slot.toggle }}\" aria-pressed=\"{{ slot.pressed }}\" aria-label=\"{{ slot.aria }}\" style=\"min-height:48px;box-sizing:border-box;border-width:1.5px;border-style:solid;border-radius:10px;font-family:inherit;font-weight:600;font-size:16px;cursor:pointer;{{ slot.css }}\">{{ slot.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:16px;font-size:14px;color:#3F5247\">\n<span style=\"display:inline-flex;align-items:center;gap:8px\"><span style=\"display:inline-block;width:16px;height:16px;border-radius:4px;background:#FFFFFF;border:1.5px solid #8A968D\"><\u002Fspan>Tersedia<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:8px\"><span style=\"display:inline-block;width:16px;height:16px;border-radius:4px;background:#0C2B20\"><\u002Fspan>Dipilih<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:8px\"><span style=\"display:inline-block;width:16px;height:16px;border-radius:4px;background:#E4E1D8\"><\u002Fspan>Tidak tersedia<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:12px 0 0;font-size:14px;line-height:1.5;color:#3F5247\">Pagi–sore {{ hargaSiangText }} per jam · Malam (mulai 17.00) {{ hargaMalamText }} per jam<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<aside aria-label=\"Ringkasan booking\" style=\"flex:1 1 340px;min-width:0;background:#FFFFFF;border:1px solid #D9D6CB;border-radius:20px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px\">\n<sc-if value=\"{{ showForm }}\" hint-placeholder-val=\"{{ true }}\">\n<h3 style=\"margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.02em;text-transform:uppercase\">Ringkasan<\u002Fh3>\n<div style=\"display:flex;flex-direction:column;gap:12px;font-size:16px\">\n<div style=\"display:flex;justify-content:space-between;gap:16px\"><span style=\"color:#4D5F55\">Tanggal<\u002Fspan><span style=\"font-weight:600;text-align:right\">{{ dateLong }}<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px\"><span style=\"color:#4D5F55\">Lapangan<\u002Fspan><span style=\"font-weight:600;text-align:right\">{{ courtName }}<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px\"><span style=\"color:#4D5F55\">Jam<\u002Fspan><span style=\"font-weight:600;text-align:right\">{{ hoursText }}<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px\"><span style=\"color:#4D5F55\">Durasi<\u002Fspan><span style=\"font-weight:600;text-align:right\">{{ durText }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:16px;border-top:1px solid #D9D6CB\">\n<span style=\"font-weight:600;font-size:16px\">Total<\u002Fspan>\n<span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:40px;line-height:1\">{{ totalText }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<label for=\"nama\" style=\"font-weight:600;font-size:15px\">Nama pemesan<\u002Flabel>\n<input id=\"nama\" type=\"text\" autocomplete=\"name\" placeholder=\"Nama tim atau pemesan\" style=\"min-height:48px;box-sizing:border-box;padding:0 14px;border:1.5px solid #7C897F;border-radius:10px;font-family:inherit;font-size:16px;color:#10261C;background:#FFFFFF\">\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<label for=\"wa\" style=\"font-weight:600;font-size:15px\">Nomor WhatsApp<\u002Flabel>\n<input id=\"wa\" type=\"tel\" autocomplete=\"tel\" placeholder=\"08xx xxxx xxxx\" style=\"min-height:48px;box-sizing:border-box;padding:0 14px;border:1.5px solid #7C897F;border-radius:10px;font-family:inherit;font-size:16px;color:#10261C;background:#FFFFFF\">\n<\u002Fdiv>\n<button type=\"button\" class=\"btn\" disabled=\"{{ bookDisabled }}\" sc-camel-on-click=\"{{ book }}\" style=\"min-height:52px;box-sizing:border-box;border:none;border-radius:999px;padding:0 24px;font-family:inherit;font-weight:700;font-size:17px;{{ bookCss }}\">Lanjut bayar DP<\u002Fbutton>\n<p style=\"margin:0;font-size:14px;line-height:1.5;color:#4D5F55\">DP minimum {{ dpMinText }}. Slot terkunci setelah bukti transfer kamu dikirim dan diverifikasi admin.<\u002Fp>\n<\u002Fsc-if>\n<sc-if value=\"{{ showPay }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n<h3 style=\"margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.02em;text-transform:uppercase\">Bayar DP<\u002Fh3>\n<button type=\"button\" sc-camel-on-click=\"{{ backToSelect }}\" style=\"min-height:44px;padding:0 4px;border:none;background:transparent;color:#1F6B45;font-family:inherit;font-weight:700;font-size:15px;text-decoration:underline;cursor:pointer\">Ubah jadwal<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"background:#F5F3EC;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;font-size:15px\">\n<span style=\"font-weight:700;font-size:17px\">{{ courtName }}<\u002Fspan>\n<span style=\"color:#3F5247\">{{ dateLong }} · {{ hoursText }}<\u002Fspan>\n<span style=\"color:#3F5247\">Total {{ totalText }}<\u002Fspan>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight:600;font-size:15px;margin-bottom:8px\">Pilih nominal pembayaran<\u002Fdiv>\n<div role=\"group\" aria-label=\"Pilih nominal pembayaran\" style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ dpOptions }}\" as=\"opt\" hint-placeholder-count=\"3\">\n<button type=\"button\" sc-camel-on-click=\"{{ opt.pick }}\" aria-pressed=\"{{ opt.pressed }}\" style=\"min-height:52px;box-sizing:border-box;padding:0 16px;border-width:1.5px;border-style:solid;border-radius:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:inherit;font-size:16px;{{ opt.css }}\">\n<span style=\"font-weight:600\">{{ opt.label }}<\u002Fspan>\n<span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px\">{{ opt.amountText }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin:8px 0 0;font-size:14px;line-height:1.5;color:#4D5F55\">Sisa pembayaran {{ remainText }} dilunasi di lokasi.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border:1.5px dashed #7C897F;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px\">\n<span style=\"font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#4D5F55\">Transfer ke<\u002Fspan>\n<span style=\"font-weight:700;font-size:18px\">[NAMA BANK] · [NOMOR REKENING]<\u002Fspan>\n<span style=\"font-size:15px;color:#3F5247\">a.n. [NAMA PEMILIK]<\u002Fspan>\n<span style=\"margin-top:8px;font-size:15px\">Jumlah transfer: <span style=\"font-weight:700\">{{ dpAmountText }}<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<label for=\"bukti\" style=\"font-weight:600;font-size:15px\">Unggah bukti transfer<\u002Flabel>\n<input id=\"bukti\" type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ onProof }}\" style=\"box-sizing:border-box;width:100%;min-height:48px;padding:10px 12px;border:1.5px solid #7C897F;border-radius:10px;font-family:inherit;font-size:15px;color:#10261C;background:#FFFFFF\">\n<sc-if value=\"{{ hasProofError }}\" hint-placeholder-val=\"{{ false }}\">\n<p role=\"alert\" style=\"margin:0;font-size:14px;color:#8A1F15\">{{ proofError }}<\u002Fp>\n<\u002Fsc-if>\n<sc-if value=\"{{ noProof }}\" hint-placeholder-val=\"{{ true }}\">\n<p style=\"margin:0;font-size:14px;line-height:1.5;color:#4D5F55\">Foto atau tangkapan layar bukti transfer (JPG atau PNG).<\u002Fp>\n<\u002Fsc-if>\n<sc-if value=\"{{ hasProof }}\" hint-placeholder-val=\"{{ false }}\">\n<img src=\"{{ proofUrl }}\" alt=\"Pratinjau bukti transfer yang diunggah\" style=\"width:100%;max-height:280px;object-fit:contain;border-radius:12px;border:1px solid #D9D6CB;background:#F5F3EC\">\n<span style=\"font-size:14px;color:#4D5F55\">{{ proofName }}<\u002Fspan>\n<\u002Fsc-if>\n<\u002Fdiv>\n<button type=\"button\" class=\"btn\" disabled=\"{{ payDisabled }}\" sc-camel-on-click=\"{{ submitProof }}\" style=\"min-height:52px;box-sizing:border-box;border:none;border-radius:999px;padding:0 24px;font-family:inherit;font-weight:700;font-size:17px;{{ payCss }}\">Kirim bukti transfer<\u002Fbutton>\n<p style=\"margin:0;font-size:14px;line-height:1.5;color:#4D5F55\">Booking terkonfirmasi setelah admin memverifikasi bukti transfer.<\u002Fp>\n<\u002Fsc-if>\n<sc-if value=\"{{ showDone }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:16px\">\n<span style=\"width:56px;height:56px;border-radius:50%;background:#0C2B20;display:inline-flex;align-items:center;justify-content:center\">\n<svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{accent}}\" stroke-width play:flex;flex-direction:column;gap:20px\">\n<div>\n<div style=\"font-size:14px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#A9BDB1\">Alamat<\u002Fdiv>\n<div style=\"font-size:19px;margin-top:6px\">[ALAMAT LENGKAP]<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-size:14px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#A9BDB1\">Jam buka<\u002Fdiv>\n<div style=\"font-size:19px;margin-top:6px\">[JAM BUKA]<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-size:14px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#A9BDB1\">WhatsApp<\u002Fdiv>\n<div style=\"font-size:19px;margin-top:6px\">[NOMOR WHATSAPP]<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-size:14px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#A9BDB1\">Instagram<\u002Fdiv>\n<div style=\"font-size:19px;margin-top:6px\">[@AKUN_INSTAGRAM]<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<a class=\"btn\" href=\"#kontak\" style=\"display:inline-flex;align-items:center;min-height:52px;box-sizing:border-box;padding:0 28px;border-radius:999px;background:{{accent}};color:#0C2B20;font-weight:700;font-size:17px\">Chat via WhatsApp<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 420px;min-width:0;min-height:320px;box-sizing:border-box;border:1.5px dashed #4C7A64;border-radius:20px;background:#123828;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#A9BDB1;font-size:16px\">\n<svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.5\"><\u002Fcircle><\u002Fsvg>\n<span>[PETA LOKASI]<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;padding-top:24px;border-top:1px solid #24523F;font-size:14px;color:#A9BDB1\">\n<span>© 2026 Gol Arena Futsal<\u002Fspan>\n<span>Booking lapangan futsal online<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C9F23C&quot;,&quot;options&quot;:[&quot;#C9F23C&quot;,&quot;#FFD23F&quot;,&quot;#7CF2C0&quot;],&quot;section&quot;:&quot;Tampilan&quot;},&quot;hargaSiang&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:100000,&quot;min&quot;:0,&quot;max&quot;:1000000,&quot;step&quot;:5000,&quot;section&quot;:&quot;Harga&quot;},&quot;hargaMalam&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:150000,&quot;min&quot;:0,&quot;max&quot;:1000000,&quot;step&quot;:5000,&quot;section&quot;:&quot;Harga&quot;},&quot;dpMin&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20000,&quot;min&quot;:0,&quot;max&quot;:500000,&quot;step&quot;:5000,&quot;section&quot;:&quot;Harga&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:4600}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { dateIdx: 0, courtIdx: 0, picked: [], stage: 'select', dpChoice: 'min', proofUrl: '', proofName: '', proofError: '' };\n  }\n\n  renderVals() {\n    const accent = this.props.accent ?? '#C9F23C';\n    const pSiang = Number(this.props.hargaSiang ?? 100000);\n    const pMalam = Number(this.props.hargaMalam ?? 150000);\n    const fmt = (n) => 'Rp ' + String(Math.round(n)).replace(/\\B(?=(\\d{3})+(?!\\d))/g, '.');\n    const pad = (n) => (n < 10 ? '0' + n : '' + n);\n    const hh = (h) => pad(h) + '.00';\n    const dayShort = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];\n    const dayLong = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];\n    const monthShort = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];\n    const monthLong = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];\n    const now = new Date();\n    const { dateIdx, courtIdx, picked, stage, dpChoice, proofUrl, proofName, proofError } = this.state;\n\n    const OFF_DARK = 'background:#0C2B20;color:' + accent + ';border-color:#0C2B20;';\n    const OFF_LIGHT = 'background:#FFFFFF;color:#10261C;border-color:#8A968D;';\n    const OFF_DIM = 'background:#E4E1D8;color:#55605A;border-color:#E4E1D8;text-decoration:line-through;cursor:not-allowed;';\n\n    const days = [];\n    for (let i = 0; i < 7; i++) {\n      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);\n      const on = i === dateIdx;\n      days.push({\n        dow: i === 0 ? 'Hari ini' : dayShort[d.getDay()],\n        num: String(d.getDate()),\n        mon: monthShort[d.getMonth()],\n        long: dayLong[d.getDay()] + ', ' + d.getDate() + ' ' + monthLong[d.getMonth()] + ' ' + d.getFullYear(),\n        pressed: on,\n        css: on ? OFF_DARK : OFF_LIGHT,\n        pick: () => this.setState({ dateIdx: i, picked: [], stage: 'select' }),\n      });\n    }\n\n    const courtData = [\n      { name: 'Lapangan 1', type: 'Rumput sintetis' },\n      { name: 'Lapangan 2', type: 'Rumput sintetis' },\n      { name: 'Lapangan 3', type: 'Vinyl' },\n    ];\n    const courts = courtData.map((c, i) => {\n      const on = i === courtIdx;\n      return {\n        name: c.name,\n        type: c.type,\n        pressed: on,\n        css: on ? OFF_DARK : OFF_LIGHT,\n        pick: () => this.setState({ courtIdx: i, picked: [], stage: 'select' }),\n      };\n    });\n\n    const slots = [];\n    for (let h = 8; h <= 22; h++) {\n      const past = dateIdx === 0 && h <= now.getHours();\n      const full = ((h * 3 + dateIdx * 5 + courtIdx * 7) % 4) === 0;\n      const unavailable = past || full;\n      const on = !unavailable && picked.indexOf(h) !== -1;\n      slots.push({\n        label: hh(h),\n        unavailable: unavailable,\n        pressed: on,\n        aria: hh(h) + ' sampai ' + hh(h + 1) + (unavailable ? ', tidak tersedia' : on ? ', dipilih' : ', tersedia'),\n        css: unavailable ? OFF_DIM : on ? OFF_DARK : OFF_LIGHT,\n        toggle: () => {\n          const cur = this.state.picked.slice();\n          const k = cur.indexOf(h);\n          if (k === -1) cur.push(h); else cur.splice(k, 1);\n          cur.sort((a, b) => a - b);\n          this.setState({ picked: cur, stage: 'select' });\n        },\n      });\n    }\n\n    const sorted = picked.slice().sort((a, b) => a - b);\n    const ranges = [];\n    sorted.forEach((h) => {\n      const last = ranges[ranges.length - 1];\n      if (last && last.end === h) last.end = h + 1;\n      else ranges.push({ start: h, end: h + 1 });\n    });\n    const hasPicked = sorted.length > 0;\n    const total = sorted.reduce((s, h) => s + (h >= 17 ? pMalam : pSiang), 0);\n\n    const dpMin = Number(this.props.dpMin ?? 20000);\n    const half = Math.max(dpMin, Math.round(total / 2000) * 1000);\n    const amounts = { min: Math.min(dpMin, total), half: Math.min(half, total), full: total };\n    const dpAmount = amounts[dpChoice] !== undefined ? amounts[dpChoice] : amounts.min;\n    const dpDefs = [['min', 'DP minimum'], ['half', '50% dari total'], ['full', 'Bayar lunas']];\n    const dpOptions = dpDefs.map((o) => ({\n      label: o[1],\n      amountText: fmt(amounts[o[0]]),\n      pressed: dpChoice === o[0],\n      css: dpChoice === o[0] ? OFF_DARK : OFF_LIGHT,\n      pick: () => this.setState({ dpChoice: o[0] }),\n    }));\n    const hasProof = !!proofUrl;\n\n    return {\n      accent: accent,\n      days: days,\n      courts: courts,\n      slots: slots,\n      dateLong: days[dateIdx].long,\n      courtName: courtData[courtIdx].name,\n      hoursText: hasPicked ? ranges.map((r) => hh(r.start) + '–' + hh(r.end)).join(', ') : 'Belum dipilih',\n      durText: hasPicked ? sorted.length + ' jam' : '–',\n      totalText: fmt(total),\n      showForm: stage === 'select',\n      showPay: stage === 'pay',\n      showDone: stage === 'done',\n      bookDisabled: !hasPicked,\n      bookCss: hasPicked\n        ? 'background:#0C2B20;color:' + accent + ';cursor:pointer;'\n        : 'background:#E4E1D8;color:#55605A;cursor:not-allowed;',\n      book: () => this.setState({ stage: 'pay' }),\n      reset: () => this.setState({ picked: [], stage: 'select', dpChoice: 'min', proofUrl: '', proofName: '', proofError: '' }),\n      hargaSiangText: fmt(pSiang),\n      hargaMalamText: fmt(pMalam),\n      fromText: fmt(Math.min(pSiang, pMalam)),\n      dpMinText: fmt(dpMin),\n      dpOptions: dpOptions,\n      dpAmountText: fmt(dpAmount),\n      remainText: fmt(total - dpAmount),\n      hasProof: hasProof,\n      noProof: !hasProof,\n      proofUrl: proofUrl,\n      proofName: proofName,\n      hasProofError: !!proofError,\n      proofError: proofError,\n      payDisabled: !hasProof,\n      payCss: hasProof\n        ? 'background:#0C2B20;color:' + accent + ';cursor:pointer;'\n        : 'background:#E4E1D8;color:#55605A;cursor:not-allowed;',\n      backToSelect: () => this.setState({ stage: 'select' }),\n      submitProof: () => this.setState({ stage: 'done' }),\n      onProof: (e) => {\n        const f = e && e.target && e.target.files && e.target.files[0];\n        if (!f) return;\n        if (f.type.indexOf('image/') !== 0) {\n          this.setState({ proofUrl: '', proofName: '', proofError: 'File harus berupa gambar (JPG atau PNG).' });\n          return;\n        }\n        this.setState({\n          proofUrl: URL.createObjectURL(f),\n          proofName: f.name + ' · ' + Math.max(1, Math.round(f.size / 1024)) + ' KB',\n          proofError: '',\n        });\n      },\n      choose1: () => this.setState({ courtIdx: 0, picked: [], stage: 'select' }),\n      choose2: () => this.setState({ courtIdx: 1, picked: [], stage: 'select' }),\n      choose3: () => this.setState({ courtIdx: 2, picked: [], stage: 'select' }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
